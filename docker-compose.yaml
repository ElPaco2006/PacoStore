name: Paco-Store
services:
  frontend:
    image: nginx:latest
    volumes:
      - ./src/frontend:/usr/share/nginx/html
    ports:
      - "6767:80"

  backend:
    image: node:26
    user: node
    working_dir: /home/node/app
    environment:
      - NODE_ENV=development
    volumes:
      - ./:/home/node/app
    ports:
      - "8888:8888"
    command: ['npm', 'run', 'dev']      
  
  database:
    image: postgres:18
    env_file:
      - env/.env
    volumes:
      - db-data:/var/lib/postgresql/
      - ./database/db.sql:/docker-entrypoint-initdb.d/db.sql
    ports:
      - "5432:5432"

volumes:
  db-data: