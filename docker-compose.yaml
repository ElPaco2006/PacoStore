name: Paco-Store
services:
  frontend:
    image: nginx:latest
    volumes:
      - ./src/frontend:/usr/share/nginx/html
    ports:
      - "6767:80"
    networks:
      - frontend

  backend:
    image: node:26
    user: node
    working_dir: /home/node/app    
    volumes:
      - ./:/home/node/app
    command: ['npm', 'run', 'dev']
    ports:
      - "6868:8888"
    networks:
      - frontend
      - backend
  
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: paco
      POSTGRES_PASSWORD: elpapu31
      POSTGRES_DB: paco-store
    volumes:      
      - ./database/db.sql:/docker-entrypoint-initdb.d/db.sql
    ports:
      - "6969:5432" 
    networks:
      - backend

networks:
  frontend:
  backend: